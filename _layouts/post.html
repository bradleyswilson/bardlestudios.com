  <p class="back"><a href="/devlog/">Devlog</a></p>

  <p class="date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time></p>
  <div class="prose">
{{ content }}
  </div>

    <h2>Get the next entry by email</h2>

</article>
