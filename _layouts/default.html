<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ site.description }}">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="alternate" type="application/atom+xml" title="Bardle Studios devlog" href="/feed.xml">
</head>
<body class="{{ page.body_class }}">
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="wordmark" href="/">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 4 L20 16 L16 16 Z" fill="var(--north)"/><path d="M16 28 L12 16 L16 16 Z" fill="var(--south)"/></svg>
      Bardle Studios
    </a>
    <nav aria-label="Main">
      <a class="nav-game" href="/#declination">Declination</a>
      <a href="/devlog/">Devlog</a>
      <a class="nav-signup" href="/#signup">Sign up</a>
    </nav>
  </header>

  <main id="main">
{{ content }}
  </main>

  <footer class="site-footer">
    <p>Bardle Studios, Little Rock, Arkansas</p>
    <p><a href="/feed.xml">RSS</a></p>
  </footer>
  <script src="/assets/field.js" defer></script>
</body>
</html>
